name: Board sync
# Keeps the issues and GitHub Project 4 (Status: Todo / In Progress / Done) in step. See .github/scripts/board_sync.py.
on:
  issues:
    types: [opened, reopened, closed, labeled]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  issues: write
concurrency:
  group: board-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/board_sync.py
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
